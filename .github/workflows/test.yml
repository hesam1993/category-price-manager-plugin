name: Category prices - tests and release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: "Price updates and undo | PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      database:
        image: mariadb:11.4
        env:
          # The migration fixture connects as root with an empty password.
          # This database exists only inside the disposable CI runner.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: cpm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.12 for translation and release checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up PHP and MySQL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli
          coverage: none
      - name: Check plugin and test PHP file syntax
        run: |
          php -l category-price-manager.php
          find tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test admin preview, progress and history controls
        run: |
          node --check assets/admin.js
          node tests/admin-regression.cjs
      - name: Test price updates, undo, conflicts and permissions
        run: php tests/plugin-regression.php
      - name: Test InnoDB migration, database locks and recovery
        env:
          CPM_TEST_DB_HOST: 127.0.0.1
        run: php tests/migration-integration.php
      - name: Validate plugin metadata, translations and installation ZIP
        run: |
          python3 tools/release.py
          git diff --exit-code -- languages/

  directory-review:
    name: WordPress.org package and plugin checks
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4
      - name: Set up Python 3.12 for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installation ZIP containing runtime plugin files
        run: |
          python3 tools/release.py
          mkdir -p "$RUNNER_TEMP/directory-review"
          unzip -q dist/category-price-manager-*-review-candidate.zip -d "$RUNNER_TEMP/directory-review"
      - name: Run strict WordPress.org Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: '${{ runner.temp }}/directory-review/category-price-manager'
          slug: category-price-manager
          strict: true
      - name: Save validated plugin ZIP for download
        uses: actions/upload-artifact@v4
        with:
          name: category-price-manager-review-candidate
          path: dist/category-price-manager-*-review-candidate.zip
          if-no-files-found: error
